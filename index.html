  '#20c997','#f06595','#74c0fc','#a9e34b','#ff8787','#ffa94d',

];

const grid = document.getElementById('kgrid');

const allBtn = document.createElement('button');
allBtn.className = 'k-btn all-btn';
allBtn.textContent = 'All Kingdoms';
allBtn.dataset.k = 'ALL';
allBtn.addEventListener('click', showAll);
grid.appendChild(allBtn);

KINGDOMS.forEach((k, i) => {
  const cnt = COUNTS[k];
  const btn = document.createElement('button');
  let cls = 'k-btn';
  if (cnt >= 20) cls += ' hot';
  else if (cnt >= 15) cls += ' warm';
  btn.className = cls;
  btn.dataset.k = k;
  btn.innerHTML = `K${k}<span class="k-count">${cnt}</span>`;
  btn.addEventListener('click', () => showKingdom(k));
  grid.appendChild(btn);
});

const ctx = document.getElementById('scatter').getContext('2d');
let chart = null;

const scaleOpts = {
  min: 0, max: 999,
  ticks: { color: '#888', stepSize: 100 },
  grid:  { color: 'rgba(255,255,255,0.07)' }
};

function makeTooltip() {
  return {
    callbacks: {
      label(ctx) {
        const pt = ctx.raw;
        return [`K${pt.k}  X:${pt.x}  Y:${pt.y}`, `Time: ${pt.t}`];
      }
    },
    backgroundColor: '#0d0d1f',
    borderColor: '#ffd700',
    borderWidth: 1,
    titleColor: '#ffd700',
    bodyColor: '#ddd',
    padding: 10
  };
}

function setActive(k) {
  document.querySelectorAll('.k-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-k="${k}"]`);
  if (btn) btn.classList.add('active');
}

function showKingdom(k) {
  setActive(k);
  const pts   = RAW[k].map(p => ({x: p.x, y: p.y, t: p.t, k}));
  const count = pts.length;
  document.getElementById('chart-title').textContent = `Kingdom ${k}`;
  document.getElementById('chart-meta').textContent  = `${count} sighting${count !== 1 ? 's' : ''}`;
  document.getElementById('legend-bar').innerHTML    = '';
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [{
        label: `K${k}`,
        data: pts,
        backgroundColor: 'rgba(255,215,0,0.75)',
        borderColor: '#ffd700',
        borderWidth: 1,
        pointRadius: 8,
        pointHoverRadius: 11,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: makeTooltip() },
      scales: {
        x: { ...scaleOpts, title: { display: true, text: 'X Coordinate', color: '#aaa' } },
        y: { ...scaleOpts, title: { display: true, text: 'Y Coordinate', color: '#aaa' } }
      }
    }
  });
}

function showAll() {
  setActive('ALL');
  document.getElementById('chart-title').textContent = 'All Kingdoms';
  document.getElementById('chart-meta').textContent  = '1309 sightings';
  const datasets = KINGDOMS.map((k, i) => ({
    label: `K${k}`,
    data: RAW[k].map(p => ({x: p.x, y: p.y, t: p.t, k})),
    backgroundColor: PALETTE[i % PALETTE.length] + 'bb',
    borderColor:     PALETTE[i % PALETTE.length],
    borderWidth: 0.5,
    pointRadius: 5,
    pointHoverRadius: 8,
  }));
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: makeTooltip() },
      scales: {
        x: { ...scaleOpts, title: { display: true, text: 'X Coordinate', color: '#aaa' } },
        y: { ...scaleOpts, title: { display: true, text: 'Y Coordinate', color: '#aaa' } }
      }
    }
  });
  const lb = document.getElementById('legend-bar');
  lb.innerHTML = '';
  KINGDOMS.forEach((k, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${PALETTE[i%PALETTE.length]}"></div>K${k}`;
    lb.appendChild(item);
  });
}

// Default view
showKingdom(KINGDOMS.find(k => COUNTS[k] === Math.max(...Object.values(COUNTS))) || KINGDOMS[10]);
